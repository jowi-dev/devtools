[backend]
provider = "github"

[work.lanes.devtools]
# "." resolves to this repo's own root (repo-local .tskmstr.toml only), so
# per-ticket worktrees are provisioned from this repo and the lane is always
# backend-compatible with this repo's board.
repo = "."
# Explicit rather than relying on the origin/HEAD fallback: a clone whose
# origin/HEAD symbolic ref was never set has nothing for resolve_base to
# fall back to, and the lane run fails preflight.
base_branch = "main"
